name: Docs Doctrine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctrine:
    uses: alawein/alawein/.github/workflows/doctrine-reusable.yml@2f5fcdf0611ae08090c8865d7c0c5030c3274feb
    with:
      strict: "true"
