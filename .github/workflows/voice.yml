name: voice

# Enforces the voice rule: no em-dash (U+2014) in user-visible prose.
#
# - Prose connectives use ';' or ',' instead.
# - Decorative separators in titles/labels use '·' (U+00B7).
# - Date ranges use en-dash '–' (U+2013).
# - Table placeholders use 'pending' or are left blank.
#
# Excluded paths:
# - CHANGELOG.md: historical record, immutable.
# - docs/superpowers/**: internal planning artifacts.
# - docs/INDEX.md: generated by alawein-workspace generate-index.sh; fix upstream template.
# - .claude/**, .superpowers/**: local tooling, not public-facing.
# - website/**.{css,svg}: CSS `content: '—'` glyphs are intentional design.

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.html'
      - '**/*.tex'
      - '**/*.mdx'
      - '.github/workflows/voice.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.html'
      - '**/*.tex'
      - '**/*.mdx'
      - '.github/workflows/voice.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-em-dash-in-prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Grep for U+2014 in enforced paths
        run: |
          set -euo pipefail
          # Enforced paths only; excludes are pruned before grep.
          mapfile -t hits < <(
            git ls-files -- \
              '*.md' '*.html' '*.tex' '*.mdx' \
              ':!CHANGELOG.md' \
              ':!docs/superpowers/**' \
              ':!docs/INDEX.md' \
              ':!.claude/**' \
              ':!.superpowers/**' \
            | xargs -r grep -nP '\x{2014}' || true
          )
          if [ "${#hits[@]}" -gt 0 ]; then
            echo "Voice-rule violation: em-dash (U+2014) found in user-visible prose."
            echo "Replace with ';' (prose), '·' (titles/labels), '–' (date ranges),"
            echo "or 'pending'/empty (table placeholders). See docs/style/VOICE.md."
            echo
            printf '%s\n' "${hits[@]}"
            exit 1
          fi
          echo "OK: no em-dash in enforced prose paths."
